<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TET 2A English Quiz Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single centered column, one question card at a time, teacher masthead on top, credit footer */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#1d2a26; --muted:#5b6b66; --line:#d3ddd9;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --good:#1c7c3f; --good-soft:#e1f4e7; --bad:#b3362c; --bad-soft:#fbe5e2;
  --display:"Literata",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a18; --surface:#1b2623; --ink:#e4ece9; --muted:#9db0aa; --line:#2f3d39;
  --accent:#5fc3a6; --accent-soft:#1f3a33; --good:#6fd394; --good-soft:#173826; --bad:#f08a80; --bad-soft:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a18; --surface:#1b2623; --ink:#e4ece9; --muted:#9db0aa; --line:#2f3d39;
  --accent:#5fc3a6; --accent-soft:#1f3a33; --good:#6fd394; --good-soft:#173826; --bad:#f08a80; --bad-soft:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);flex:none}
header .t{min-width:0;flex:1}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-size:1.5rem;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.bar{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px}
.topic{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.08rem;white-space:pre-line;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.exp b{display:block;margin-bottom:4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.score{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;width:100%}
.dot{font:inherit;font-size:14px;font-weight:700;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.r{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
footer{text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
footer strong{color:var(--ink);font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.sets{display:grid;gap:12px}
.set{display:flex;gap:14px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.set:hover{border-color:var(--accent)}
.set:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.set .no{flex:none;width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem}
.set .info{min-width:0;flex:1}
.set .rng{font-family:var(--display);font-weight:700;font-size:1.05rem}
.set .tp{color:var(--muted);font-size:14px;margin-top:2px}
.set .best{font-size:12px;color:var(--good);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.set .go{flex:none;color:var(--accent);font-size:1.4rem;font-weight:700}
.backrow{display:flex}
.intro{margin:0;color:var(--muted)}
</style>
</head>

<script>
const SETS = [{"from": 1, "to": 30, "sub": "Vocabulary, idioms, proverbs, homophones, word formation and collocations", "q": [{"t": "Vocabulary", "q": "Taro saw a beautiful little waterfall.\nChoose the synonym of the word 'beautiful'.", "o": ["ugly", "unattractive", "displeasing", "good-looking"], "a": 3, "e": "'Beautiful' means pleasing to look at, so its synonym is 'good-looking'. The other three options are antonyms."}, {"t": "Vocabulary", "q": "How much did you pay for that Hilsa?\nChoose the synonym of the word 'pay'.", "o": ["refuse to give", "hold back", "keep hold of", "give payment"], "a": 3, "e": "'Pay' means to give money in exchange for something, i.e. 'give payment'. The other options mean the opposite."}, {"t": "Vocabulary", "q": "He breathed heavily.\nChoose the synonym of the word 'heavily'.", "o": ["easily", "quickly", "with difficulty", "simply"], "a": 2, "e": "'Breathed heavily' means breathing with effort, so 'heavily' here means 'with difficulty'."}, {"t": "Vocabulary", "q": "Open your petals wide.\nChoose the antonym of the word 'wide'.", "o": ["fully", "all the way", "completely", "partly"], "a": 3, "e": "'Wide' here means fully open. Its opposite is 'partly'. 'Fully', 'all the way' and 'completely' are synonyms."}, {"t": "Vocabulary", "q": "He grabbed a branch.\nChoose the antonym of the word 'grabbed'.", "o": ["released", "seized", "grasped", "snatched"], "a": 0, "e": "'Grabbed' means took hold of firmly. The opposite is 'released' (let go). 'Seized', 'grasped' and 'snatched' are synonyms."}, {"t": "Vocabulary", "q": "The horse galloped out of the stable.\nChoose the antonym of the word 'out'.", "o": ["away", "not in", "in", "exposed"], "a": 2, "e": "The direct opposite of 'out' is 'in'."}, {"t": "Vocabulary", "q": "Choose the correctly spelt word.", "o": ["Pregncancy", "Pregnancy", "Pregnaency", "Pregniency"], "a": 1, "e": "The correct spelling is P-R-E-G-N-A-N-C-Y: Pregnancy."}, {"t": "Vocabulary", "q": "Choose the correctly spelt word.", "o": ["Senatoriail", "Senatoroyl", "Cenatorial", "Senatorial"], "a": 3, "e": "The correct spelling is Senatorial (relating to a senate or senator)."}, {"t": "Vocabulary", "q": "Choose the correctly spelt word.", "o": ["Spandthtift", "Spendthrift", "Spendtrift", "Spendhtrift"], "a": 1, "e": "The correct spelling is Spendthrift: a person who spends money wastefully."}, {"t": "Vocabulary", "q": "One word: A person who is not sure about the existence of God.", "o": ["agnostic", "didactic", "verbose", "culprit"], "a": 0, "e": "An agnostic is unsure whether God exists. Compare: an atheist believes there is no God."}, {"t": "Vocabulary", "q": "One word: A person who is extremely important or large in size.", "o": ["colossus", "culprit", "detractors", "publishers"], "a": 0, "e": "A colossus is a person or thing of enormous size or importance."}, {"t": "Vocabulary", "q": "One word: A person who studies birds scientifically.", "o": ["Ornithologist", "Archaeologist", "Psychologist", "Anthropologist"], "a": 0, "e": "An ornithologist studies birds. An archaeologist studies ancient remains; a psychologist studies the mind; an anthropologist studies human societies."}, {"t": "Idioms & Proverbs", "q": "Identify the meaning of the given idiom: \"head was in a whirl\"", "o": ["Confused and unable to think clearly.", "Doing something", "Carefully corrected", "getting bored"], "a": 0, "e": "When your 'head is in a whirl', you feel dizzy and confused and cannot think clearly."}, {"t": "Idioms & Proverbs", "q": "Our entire class is quacking in its boots.\nIdentify the suitable meaning of the underlined part (quacking in its boots).", "o": ["willing to do something", "be very worried", "suffering with pain", "joyful"], "a": 1, "e": "The idiom is 'quaking in one's boots': trembling with fear, i.e. being very worried or frightened."}, {"t": "Idioms & Proverbs", "q": "Identify the meaning of the idiom \"fly high\".", "o": ["Be polite", "Be humble", "Be successful", "Be perfect"], "a": 2, "e": "To 'fly high' means to be very successful."}, {"t": "Idioms & Proverbs", "q": "Choose the meaning of the phrasal verb \"break down\".", "o": ["to continue efforts.", "to complete the given tasks.", "to stop working because of a fault.", "to have control."], "a": 2, "e": "'Break down' means a machine or vehicle stops working because of a fault, e.g. 'The bus broke down on the way.'"}, {"t": "Idioms & Proverbs", "q": "Choose the meaning of the phrasal verb \"fed up\".", "o": ["tired and happy", "surprised and shocked", "tired and unhappy", "smiled and cried"], "a": 2, "e": "'Fed up' means bored, annoyed and unhappy with something that has gone on too long."}, {"t": "Idioms & Proverbs", "q": "If you carry on spending money like this, you will end up in debt.\nIdentify the meaning of the phrasal verb 'carry on'.", "o": ["stop", "behave", "continue", "improve"], "a": 2, "e": "'Carry on' means to continue doing something."}, {"t": "Idioms & Proverbs", "q": "Akash always helps his family members first before helping others in the village.\nChoose the correct proverb for the situation.", "o": ["Every cloud has a silver lining.", "Charity begins at home.", "Care is no cure.", "Carry your own cross."], "a": 1, "e": "'Charity begins at home' means you should look after your own family first before helping others."}, {"t": "Idioms & Proverbs", "q": "Everyone laughed at Meena's simple dress, but she won the first prize in the science competition.\nChoose the correct proverb for the situation.", "o": ["Practice makes perfect.", "Where there is a will, there is a way.", "Do not judge a book by its cover.", "Too many cooks spoil the broth."], "a": 2, "e": "People judged Meena by her simple dress, but her ability proved them wrong: 'Do not judge a book by its cover.'"}, {"t": "Idioms & Proverbs", "q": "After playing for hours in the hot sun, the children enjoyed even the simple meal of rice and pickle as if it were a feast.\nChoose the correct proverb for the situation.", "o": ["Health is wealth.", "Home is where the heart is.", "Honey in the mouth, bile in the heart.", "Hunger is the best sauce."], "a": 3, "e": "When you are very hungry, even simple food tastes delicious: 'Hunger is the best sauce.'"}, {"t": "Word Formation", "q": "I have kept a ___ to write about my father's milk ____.\nUse the appropriate words in the blanks.", "o": ["diary, dairy", "dairy, diary", "dairy, dairy", "diary, diary"], "a": 0, "e": "A diary is a book for daily notes; a dairy is a place or business that deals in milk. So: 'kept a diary … milk dairy'."}, {"t": "Word Formation", "q": "Giving up this piece of land will bring a lot of peace in this region.\nThe underlined words (piece, peace) are called", "o": ["Homonyms", "Homographs", "Homophones", "Collocations"], "a": 2, "e": "'Piece' and 'peace' sound the same but differ in spelling and meaning, so they are homophones."}, {"t": "Word Formation", "q": "A word that is spelt like another word or pronounced like it but that has a different meaning is called:", "o": ["Homophone", "Homonym", "Homograph", "Collocation"], "a": 1, "e": "This definition covers both same spelling and same sound, which is a homonym. Homophones and homographs are types of homonyms."}, {"t": "Word Formation", "q": "Which of the following suffixes converts the adjective 'new' into a noun?", "o": ["-ly", "-ful", "-ness", "-able"], "a": 2, "e": "new + -ness = newness (a noun). '-ly' would make an adverb (newly)."}, {"t": "Word Formation", "q": "By adding which prefix to the word 'weight' do we get the meaning thin or weak?", "o": ["semi-", "over-", "anti-", "under-"], "a": 3, "e": "under + weight = underweight (weighing too little). 'Overweight' means weighing too much."}, {"t": "Word Formation", "q": "Choose the word with a suffix that means 'without'.", "o": ["reachable", "careless", "invincible", "kindness"], "a": 1, "e": "The suffix '-less' means 'without': careless = without care."}, {"t": "Word Formation", "q": "The university ___ the honorary degree on the social worker.\nChoose the word that collocates best.", "o": ["deferred", "conferred", "confirmed", "collocated"], "a": 1, "e": "The natural collocation is 'confer a degree on someone', meaning to award it formally."}, {"t": "Word Formation", "q": "He was arrested in ____ driving case.\nChoose the word that collocates best.", "o": ["danger", "faster", "speed", "drunken"], "a": 3, "e": "'Drunken driving' (or 'drunk driving') is the fixed collocation for driving after drinking alcohol."}, {"t": "Word Formation", "q": "The ____ growth of real estate poses a serious threat to our environment.\nChoose the word that collocates best.", "o": ["increase", "gradual", "quickly", "rapid"], "a": 3, "e": "'Rapid growth' is the natural collocation and fits a 'serious threat'. 'Quickly' is an adverb and cannot come before a noun."}]}, {"from": 31, "to": 60, "sub": "Foreign phrases, tenses, articles, prepositions, clauses, degrees, question tags and reported speech", "q": [{"t": "Foreign Phrases", "q": "Identify the meaning of the given foreign phrase: \"viva voce\".", "o": ["vice president", "very important", "a spoken exam", "volunteer"], "a": 2, "e": "'Viva voce' (Latin, 'with the living voice') means an oral or spoken examination."}, {"t": "Foreign Phrases", "q": "Identify the meaning of the given foreign phrase: 'bon voyage'.", "o": ["Congratulations", "Happy birthday", "Have a good journey", "Wish you good luck"], "a": 2, "e": "'Bon voyage' (French) is said to someone leaving on a trip: have a good journey."}, {"t": "Foreign Phrases", "q": "Choose the foreign phrase that means a link language.", "o": ["en masse", "sine die", "lingua franca", "ad hoc"], "a": 2, "e": "A lingua franca is a common language used between speakers of different languages. 'En masse' = all together; 'sine die' = without a fixed date; 'ad hoc' = for a particular purpose."}, {"t": "Grammar", "q": "I ____ (work) at the computer since 5 a.m.\nChoose the option that fits in the blank.", "o": ["has been working", "am working", "have been working", "am been working"], "a": 2, "e": "'Since 5 a.m.' shows an action that started in the past and is still going on, so we use the Present Perfect Continuous. With 'I' it is 'have been working'."}, {"t": "Grammar", "q": "The earth _____ (revolve) round the sun.\nChoose the option that fits in the blank.", "o": ["revolving", "revolved", "revolves", "revolve"], "a": 2, "e": "A universal truth takes the Simple Present. 'The earth' is singular, so the verb takes -s: revolves."}, {"t": "Grammar", "q": "The cost of living ___ (increase) day by day.\nChoose the option that fits in the blank.", "o": ["was increased", "increase", "is increasing", "increasing"], "a": 2, "e": "'Day by day' describes a change happening now and continuing, so we use the Present Continuous: is increasing."}, {"t": "Grammar", "q": "He is ____ honest man.\nChoose the correct option.", "o": ["a", "an", "the", "no article"], "a": 1, "e": "The 'h' in 'honest' is silent, so the word begins with a vowel sound. Use 'an': an honest man."}, {"t": "Grammar", "q": "He can play ___ flute.\nChoose the correct option.", "o": ["a", "an", "the", "no article"], "a": 2, "e": "We use 'the' before musical instruments: play the flute, play the guitar."}, {"t": "Grammar", "q": "I usually have ___ lunch at 2 pm.\nChoose the correct option.", "o": ["a", "an", "the", "no article"], "a": 3, "e": "Names of meals (breakfast, lunch, dinner) usually take no article: have lunch."}, {"t": "Grammar", "q": "Choose the correct preposition.\nThe cat jumped ____ the chair.", "o": ["of", "off", "to", "on"], "a": 1, "e": "'Jumped off the chair' means it jumped down from the chair. 'Off' shows movement away from a surface."}, {"t": "Grammar", "q": "Choose the correct preposition.\nI've been waiting ___ 40 minutes.", "o": ["for", "since", "from", "to"], "a": 0, "e": "Use 'for' with a length of time (40 minutes). Use 'since' with a starting point (since 5 o'clock)."}, {"t": "Grammar", "q": "Choose the correct word.\nI'll wait ___ you're ready.", "o": ["after", "unless", "while", "until"], "a": 3, "e": "'Until' means up to the time that: I'll wait until you're ready."}, {"t": "Grammar", "q": "Choose the adjective clause in the given sentence.\nThe dog that bites does not bark.", "o": ["The dog", "that bites", "does not", "bark"], "a": 1, "e": "'That bites' describes the noun 'dog' (which dog?), so it is an adjective (relative) clause."}, {"t": "Grammar", "q": "Choose the suitable adverb clause that fits in the blank.\nFools rush in ______.", "o": ["where I had left them", "because he is arrogant", "if we don't take a taxi", "where wise men fear to tread"], "a": 3, "e": "The saying is 'Fools rush in where angels (wise men) fear to tread'. The clause tells us where, so it is an adverb clause of place."}, {"t": "Grammar", "q": "No one knows who he is.\nThe underlined part (who he is) is a _____.", "o": ["Noun clause", "Adjective clause", "Adverb clause", "Main clause"], "a": 0, "e": "'Who he is' answers 'knows what?'. It is the object of the verb 'knows', so it is a noun clause."}, {"t": "Grammar", "q": "Change the following into Comparative Degree.\n\"No other city in India is as big as Mumbai.\"", "o": ["Mumbai in India is very big.", "Mumbai is the biggest city in India.", "Mumbai is bigger than any other city in India.", "Mumbai is bigger of all cities in India."], "a": 2, "e": "Positive 'No other … as big as' becomes Comparative 'bigger than any other …'. Option 2 is the Superlative form."}, {"t": "Grammar", "q": "Fill in the blank with the suitable degree of the adjective.\nMy new car is ____ than my old one. (fast)", "o": ["fastest", "the fastest", "faster", "fast"], "a": 2, "e": "Two things are compared and 'than' follows, so use the comparative: faster."}, {"t": "Grammar", "q": "Change the following sentence into Positive Degree.\n\"The pen is mightier than the sword.\"", "o": ["The sword is mightier than the pen.", "The sword is not so mighty as the pen.", "No other pen is as mighty as sword.", "The sword is so mighty as the pen."], "a": 1, "e": "'A is mightier than B' becomes 'B is not so (as) mighty as A' in the positive degree."}, {"t": "Grammar", "q": "Identify the sentence expressing \"possibility\".", "o": ["May I leave the class?", "May God bless you!", "You may go.", "We may attend the birthday party."], "a": 3, "e": "'We may attend' shows something that might happen (possibility). 'May I…?' asks permission, 'You may go' gives permission, and 'May God bless you!' is a wish."}, {"t": "Grammar", "q": "Choose the language function of the given sentence.\nShall I carry your luggage?", "o": ["Suggestion", "Permission", "Offer", "Request"], "a": 2, "e": "'Shall I + verb?' is used when you offer to do something for someone. It is an offer."}, {"t": "Grammar", "q": "Choose the language function of the given sentence.\nMay God bless you!", "o": ["Possibility", "Permission", "Cursing", "Blessing"], "a": 3, "e": "'May God bless you!' expresses a good wish for someone. It is a blessing."}, {"t": "Grammar", "q": "We have met before, ______\nChoose the correct question tag.", "o": ["have we?", "haven't we?", "aren't we?", "are we?"], "a": 1, "e": "A positive statement takes a negative tag, using the same helping verb 'have': haven't we?"}, {"t": "Grammar", "q": "He lives in France, ______\nChoose the correct question tag.", "o": ["doesn't she?", "doesn't it?", "doesn't he?", "does he?"], "a": 2, "e": "'He lives' is Simple Present with no helping verb, so the tag uses 'does'. Positive statement, negative tag, same subject: doesn't he?"}, {"t": "Grammar", "q": "She can't drive, _____\nChoose the correct question tag.", "o": ["is she?", "can she?", "are she?", "has she?"], "a": 1, "e": "A negative statement ('can't') takes a positive tag with the same helping verb: can she?"}, {"t": "Grammar", "q": "Three butterflies lived in a garden.\nIdentify the type of sentence.", "o": ["Declarative", "Interrogative", "Imperative", "Exclamatory"], "a": 0, "e": "It simply states a fact, so it is a declarative (assertive) sentence."}, {"t": "Grammar", "q": "How cold the night is!\nIdentify the type of sentence.", "o": ["Declarative", "Exclamatory", "Interrogative", "Imperative"], "a": 1, "e": "It begins with 'How' and ends with '!', expressing strong feeling. It is exclamatory."}, {"t": "Grammar", "q": "Have mercy upon us.\nIdentify the type of sentence.", "o": ["Assertive", "Interrogative", "Imperative", "Exclamatory"], "a": 2, "e": "It is a request or appeal starting with a verb ('Have'), so it is imperative."}, {"t": "Grammar", "q": "\"I took it home with me,\" she said.\nChoose the correct Indirect speech.", "o": ["She said that she took it home with me.", "She said that she took it home with her.", "She said that had taken it home with him.", "She said that she had taken it home with her."], "a": 3, "e": "The reporting verb 'said' is in the past, so 'took' becomes 'had taken'. 'I' becomes 'she' and 'me' becomes 'her'."}, {"t": "Grammar", "q": "He said, \"I have lost my umbrella.\"\nChoose the correct Indirect speech.", "o": ["He said that he had lost my umbrella.", "He said that he had lost his umbrella.", "He said that she had lost his umbrella.", "He said that she had lost her umbrella."], "a": 1, "e": "'Have lost' becomes 'had lost'. 'I' becomes 'he' and 'my' becomes 'his'."}, {"t": "Grammar", "q": "He said, \"Where is she going?\"\nChoose the correct Indirect speech.", "o": ["He asked where is he going.", "He asked that where was she going.", "He asked where she was going.", "He asked where she is going."], "a": 2, "e": "For a Wh-question use 'asked' + question word + subject + verb (statement order), with no 'that'. 'Is going' becomes 'was going'."}]}, {"from": 61, "to": 90, "sub": "Voice, tenses, subject-verb agreement, jumbled words, parts of speech, linkers, transformation, error spotting and reading comprehension", "q": [{"t": "Grammar", "q": "The little girl caught the ball.\nChoose the correct passive voice.", "o": ["The ball is caught by the little girl.", "The ball has caught by the girl.", "The ball was caught by the little girl.", "The ball were caught by the little girl."], "a": 2, "e": "Simple Past active becomes 'was/were + V3' in passive. 'The ball' is singular: The ball was caught by the little girl."}, {"t": "Grammar", "q": "They are repairing the bridge.\nChoose the correct passive voice.", "o": ["The bridge was being repaired by them.", "The bridge has been repaired by them.", "The bridge had been repaired by them.", "The bridge is being repaired by them."], "a": 3, "e": "Present Continuous active becomes 'is/are being + V3' in passive: The bridge is being repaired by them."}, {"t": "Grammar", "q": "She has packed the books.\nChoose the correct passive voice.", "o": ["The books has been packed by her.", "The books had been packed by her.", "The books have been packed by her.", "The books are been packed by her."], "a": 2, "e": "Present Perfect active becomes 'has/have been + V3'. 'Books' is plural, so use 'have': The books have been packed by her."}, {"t": "Grammar", "q": "Identify the tense of the following sentence.\nHe liked that place very much.", "o": ["Simple past tense", "Simple present tense", "Simple future tense", "Past perfect tense"], "a": 0, "e": "'Liked' is the past form (V2) of 'like' with no helping verb, so it is Simple Past."}, {"t": "Grammar", "q": "Identify the tense of the following sentence.\nThe ants were going in a line.", "o": ["Simple present tense", "Present continuous tense", "Simple past tense", "Past continuous tense"], "a": 3, "e": "'Were going' is was/were + verb-ing, which is the Past Continuous tense."}, {"t": "Grammar", "q": "Identify the tense of the following sentence.\nThe entire field had become wet.", "o": ["Present perfect tense", "Past perfect tense", "Present continuous tense", "Past continuous tense"], "a": 1, "e": "'Had become' is had + V3, which is the Past Perfect tense."}, {"t": "Grammar", "q": "Neither of the two men ___ very strong.\nChoose the correct option.", "o": ["was", "were", "are", "have"], "a": 0, "e": "'Neither of' means not one of them, so it takes a singular verb: Neither of the two men was very strong."}, {"t": "Grammar", "q": "The jury ___ divided in their opinions.\nChoose the correct option.", "o": ["is", "was", "are", "has"], "a": 2, "e": "When members of a collective noun act as individuals with different opinions ('their opinions'), it takes a plural verb: are."}, {"t": "Grammar", "q": "Choose the sentence which has correct agreement of the verb with its subject.", "o": ["He and I was playing.", "Either the cat or the dog have been here.", "The news is true.", "Neither you nor he are to blame."], "a": 2, "e": "'News' looks plural but is singular, so 'The news is true' is correct. The others should be: He and I were; Either the cat or the dog has; Neither you nor he is."}, {"t": "Grammar", "q": "Put the words in the correct order to make a meaningful sentence.\nto work (A) / every day (B) / walks (C) / Lisa (D)", "o": ["CDAB", "ABDC", "BCDA", "DCAB"], "a": 3, "e": "Subject + verb + place + time: Lisa (D) walks (C) to work (A) every day (B) = DCAB."}, {"t": "Grammar", "q": "Rearrange these words to make a meaningful sentence.\nshe (A) / everyday (B) / a newspaper (C) / reads (D)", "o": ["CDBA", "ABDC", "ADCB", "DCAB"], "a": 2, "e": "Subject + verb + object + time: She (A) reads (D) a newspaper (C) everyday (B) = ADCB."}, {"t": "Grammar", "q": "Rearrange these words to make a meaningful sentence.\nimmediately (A) / called (B) / she (C) / back (D) / me (E)", "o": ["BCDEA", "CEBDA", "CBEDA", "CADEB"], "a": 2, "e": "She (C) called (B) me (E) back (D) immediately (A) = CBEDA. The object pronoun 'me' comes between 'called' and 'back'."}, {"t": "Grammar", "q": "He owned a small hotel.\nIdentify the part of speech of the word \"owned\".", "o": ["Noun", "Verb", "Pronoun", "Adverb"], "a": 1, "e": "'Owned' shows the action of possessing, so it is a verb."}, {"t": "Grammar", "q": "A small baby is in a cradle.\nIdentify the part of speech of the underlined word (small).", "o": ["Noun", "Pronoun", "Adjective", "Adverb"], "a": 2, "e": "'Small' describes the noun 'baby', so it is an adjective."}, {"t": "Grammar", "q": "The rabbit went to the cobbler.\nIdentify the part of speech of the underlined word (rabbit).", "o": ["Noun", "Pronoun", "Verb", "Adjective"], "a": 0, "e": "'Rabbit' is the name of an animal, so it is a noun."}, {"t": "Grammar", "q": "Catch me ___ you can.\nChoose the correct option.", "o": ["so", "but", "or", "if"], "a": 3, "e": "'If' introduces a condition: Catch me if you can."}, {"t": "Grammar", "q": "Think of me ____ I'm away.\nChoose the correct option.", "o": ["and", "or", "while", "so"], "a": 2, "e": "'While' means during the time that: Think of me while I'm away."}, {"t": "Grammar", "q": "The match has been cancelled ___ the bad weather.\nChoose the correct option.", "o": ["in spite of", "but", "because of", "in case"], "a": 2, "e": "'Because of' + noun gives the reason: cancelled because of the bad weather."}, {"t": "Grammar", "q": "Choose the correct compound sentence for the given simple sentence.\n\"With a great effort he lifted the box.\"", "o": ["He put forth a great effort and lifted the box.", "He lifted the box though it is heavy.", "The box is too heavy to lift for him.", "He lifted the heavy box."], "a": 0, "e": "A compound sentence joins two main clauses with a coordinating conjunction like 'and': He put forth a great effort and lifted the box."}, {"t": "Grammar", "q": "Identify the simple sentence among the following.", "o": ["He said that he was innocent.", "He confessed his fault.", "He worked hard yet did not succeed.", "Be good and you will be happy."], "a": 1, "e": "A simple sentence has only one subject and one finite verb: He confessed his fault. Option 1 is complex; options 3 and 4 are compound."}, {"t": "Grammar", "q": "Identify the complex sentence among the following.", "o": ["We believe in his innocence.", "He declared his innocence.", "He is innocent and we believe it.", "He confessed that he was guilty."], "a": 3, "e": "A complex sentence has a main clause and a dependent clause: He confessed (main) + that he was guilty (noun clause). Option 3 is compound."}, {"t": "Grammar", "q": "Choose the correct sentence.", "o": ["I has a large family back in Patna.", "I have the big family back in Patna.", "I have a large family back in Patna.", "I has a big family back in Patna."], "a": 2, "e": "'I' takes 'have', not 'has', and a family mentioned for the first time takes 'a': I have a large family back in Patna."}, {"t": "Grammar", "q": "Identify the part that has an error.\nNo sooner did she pour the cake batter (a) / in the baking dish (b) / then the light started to fluctuate (c) / No error (d)", "o": ["d", "a", "b", "c"], "a": 3, "e": "'No sooner' is always followed by 'than', not 'then'. The error is in part (c): …than the light started to fluctuate."}, {"t": "Grammar", "q": "Identify the correct sentence.", "o": ["My brother lives abroad.", "My brother lives in abroad.", "My brother lives at abroad.", "My brother living in abroad."], "a": 0, "e": "'Abroad' is an adverb, so it does not take a preposition like 'in' or 'at': My brother lives abroad."}, {"t": "Reading Comprehension", "q": "Long ago Queen Ahilya Bai ruled over Maheswar, a place in Madhya Pradesh. She was a warrior queen who ordered to build a strong and beautiful fort on the banks of the Narmada River. This queen had the fortress built on a hill, and from there, she could see her entire kingdom of Maheswar. This fort is also known as Ahilya Fort.\n\nWhere is Maheswar Fort located?", "o": ["On the banks of the Narmada River", "In Andhra Pradesh", "At the foot of a hill", "On the bank of a canal"], "a": 0, "e": "The passage says the queen built the fort on the banks of the Narmada River. It was on top of a hill, not at its foot, and Maheswar is in Madhya Pradesh."}, {"t": "Reading Comprehension", "q": "Once upon a time in a small village at the foot of the mighty Himalayas, lived a young girl named Minam. She loved to listen to stories about the mountains from her grandfather, who was once a Sherpa.\n\nWhat was Minam's grandfather?", "o": ["A farmer", "A mountaineer", "A Sherpa", "A musician"], "a": 2, "e": "The passage clearly states that her grandfather 'was once a Sherpa'."}, {"t": "Reading Comprehension", "q": "Once upon a time, in the state of Nagaland, humans and animals lived together. They had a disagreement about their superiority. The humans challenged the tiger and the challenge came to be known as 'Hekko'. The word 'Hekko' meant 'Challenging the tiger'.\n\nWhat is meant by \"Hekko\"?", "o": ["Challenging the animals", "Challenging the humans", "Challenging the tiger", "Challenging the challenge"], "a": 2, "e": "The last sentence of the passage says 'Hekko' meant 'Challenging the tiger'."}, {"t": "Reading Comprehension", "q": "There was a girl named Rani who lived in a village. She was very curious and used to ask many questions to her family, teachers and friends. \"Why is the sky blue?\", \"Where does the sun go at night?\"\n\nChoose the INCORRECT option based on the above paragraph.", "o": ["Rani lived in a village.", "Rani was very curious.", "Rani used to ask why the sky was blue.", "Rani never asked any questions."], "a": 3, "e": "The passage says Rani asked many questions, so 'Rani never asked any questions' is the incorrect statement. The other three are true."}, {"t": "Reading Comprehension", "q": "Madhu loved food. He always wanted to eat different kinds of food and snacks. He was never tired of eating. Every day, at noon, he would sit under a banyan tree and eat his lunch. One day, as he was eating, an old man came.\n\nChoose the correct statement based on the passage.", "o": ["Madhu loved sleeping.", "He was never tired of playing.", "He would sit on the branches of a mango tree.", "Madhu enjoyed eating."], "a": 3, "e": "Madhu loved food and was never tired of eating, so 'Madhu enjoyed eating' is correct. He sat under a banyan tree, not on a mango tree."}, {"t": "Reading Comprehension", "q": "Once upon a time, there was a farmer who liked fruits. So, he decided to grow fruits on his land. He worked hard to grow a variety of fruits. With hard work and care, the trees grew well. When the fruits were all ripe and ready to be eaten, the farmer decided to gift the best fruit to the king.\n\nChoose the INCORRECT statement based on the passage.", "o": ["The farmer liked fruits.", "He decided to gift the stale fruits to the king.", "He worked hard to grow the fruits.", "He decided to grow fruits on his land."], "a": 1, "e": "The farmer decided to gift the best fruit, not stale fruit. So option 2 is the incorrect statement."}]}, {"from": 91, "to": 120, "sub": "Literary genres, figures of speech, and prescribed poems, essays and Animal Farm", "q": [{"t": "Literary Genres & Figures of Speech", "q": "Which dramatic genre typically features a serious story that ends in sorrow or the downfall of the main character?", "o": ["Comedy", "Melodrama", "Farce", "Tragedy"], "a": 3, "e": "A tragedy is a serious play ending in suffering or the downfall of the hero, e.g. Shakespeare's Hamlet."}, {"t": "Literary Genres & Figures of Speech", "q": "How many lines does a traditional sonnet contain?", "o": ["14 lines", "12 lines", "13 lines", "11 lines"], "a": 0, "e": "A sonnet has 14 lines. The two main forms are the Petrarchan (8 + 6) and the Shakespearean (4 + 4 + 4 + 2)."}, {"t": "Literary Genres & Figures of Speech", "q": "The primary thematic focus of a traditional elegy is a/an", "o": ["folklore", "nature's song", "epic", "reflective poem expressing sorrow"], "a": 3, "e": "An elegy is a reflective poem of mourning, usually for someone who has died, e.g. Gray's 'Elegy Written in a Country Churchyard'."}, {"t": "Literary Genres & Figures of Speech", "q": "The best example of a short story is ______.", "o": ["Paradise Lost", "Ode to a Nightingale", "The Necklace", "Twelfth Night"], "a": 2, "e": "'The Necklace' is a short story by Guy de Maupassant. Paradise Lost is an epic, Ode to a Nightingale is a poem, and Twelfth Night is a play."}, {"t": "Literary Genres & Figures of Speech", "q": "\"Studies serve for delight, for ornament, and for ability\" are the famous lines from the essay", "o": ["Population", "Of Studies", "Prefaces", "Macaulay's essays"], "a": 1, "e": "This is the opening line of Francis Bacon's essay 'Of Studies'."}, {"t": "Literary Genres & Figures of Speech", "q": "\"A long narrative in prose, detailing the actions of fictitious people\" is called", "o": ["The short story", "The masque", "The Novel", "Drama"], "a": 2, "e": "A novel is a long fictional prose narrative about imaginary characters and events."}, {"t": "Literary Genres & Figures of Speech", "q": "A speech at the beginning of a play, book or film that introduces it is called a/an", "o": ["epilogue", "monologue", "prologue", "imagery"], "a": 2, "e": "A prologue comes at the beginning. An epilogue comes at the end."}, {"t": "Literary Genres & Figures of Speech", "q": "Which of the following Shakespearean works is an example of a romantic comedy?", "o": ["Hamlet", "Twelfth Night", "The Merchant of Venice", "Romeo and Juliet"], "a": 1, "e": "Twelfth Night is a romantic comedy about love and mistaken identity. Hamlet and Romeo and Juliet are tragedies."}, {"t": "Literary Genres & Figures of Speech", "q": "A speech in a play in which a character, alone on the stage, speaks his or her thoughts aloud is called", "o": ["monologue", "narration", "epilogue", "soliloquy"], "a": 3, "e": "A soliloquy is spoken by a character alone on stage, e.g. Hamlet's 'To be or not to be'. A monologue is a long speech that others may hear."}, {"t": "Literary Genres & Figures of Speech", "q": "An implied simile is called ___.", "o": ["Personification", "Metaphor", "Metonymy", "Irony"], "a": 1, "e": "A metaphor compares two things without 'like' or 'as', so it is an implied simile. Example: 'Life is a journey.'"}, {"t": "Literary Genres & Figures of Speech", "q": "A direct address to the dead, to the absent or to a personified object is called ___.", "o": ["Personification", "Metaphor", "Irony", "Apostrophe"], "a": 3, "e": "Apostrophe is speaking directly to someone absent or dead, or to a thing, e.g. 'Milton! thou shouldst be living at this hour.'"}, {"t": "Literary Genres & Figures of Speech", "q": "\"The pen is mightier than the sword\" is an example of", "o": ["Metonymy", "Irony", "Synecdoche", "Alliteration"], "a": 0, "e": "Metonymy names something by a thing closely linked with it: 'pen' stands for writing and 'sword' stands for war or force."}, {"t": "Prescribed Literature", "q": "According to Tagore in the poem \"Where the Mind is Without Fear\", why do we stretch our arms?", "o": ["To embrace our religion", "To get perfection", "To wrap our arms around loved ones", "To get wealth"], "a": 1, "e": "The poem speaks of tireless striving that stretches its arms towards perfection."}, {"t": "Prescribed Literature", "q": "Rabindranath Tagore's poem \"Where the Mind is Without Fear\" is taken from _______.", "o": ["Endymion", "Novum Organum", "Lyrical Ballads", "Gitanjali"], "a": 3, "e": "The poem is from Tagore's Gitanjali, for which he won the Nobel Prize in Literature in 1913."}, {"t": "Prescribed Literature", "q": "According to Tagore in \"Where the Mind is Without Fear\", our thought and action should be _____.", "o": ["ever widening", "narrow", "broken", "crippled"], "a": 0, "e": "Tagore prays that the mind be led forward into ever-widening thought and action."}, {"t": "Prescribed Literature", "q": "What does the word 'slumber' mean in Wordsworth's poem \"A Slumber Did My Spirit Seal\"?", "o": ["Shepherd", "Doctor", "Dawn", "Deep sleep"], "a": 3, "e": "'Slumber' means sleep. In the poem it suggests a dream-like state in which the poet felt no fear."}, {"t": "Prescribed Literature", "q": "What is the theme of William Wordsworth's poem \"A Slumber Did My Spirit Seal\"?", "o": ["Admiring nature", "The death of a loved one", "Celebrating his birth", "Wedding ceremony"], "a": 1, "e": "The poem, one of the 'Lucy poems', is about the death of a beloved person, Lucy, who is now part of the earth."}, {"t": "Prescribed Literature", "q": "In Wordsworth's poem \"A Slumber Did My Spirit Seal\", why can't she see or hear anything?", "o": ["Because she was paralyzed.", "Because she was bedridden.", "Because she was dead.", "Because she had met with an accident."], "a": 2, "e": "The poem says she now has no motion or force and neither hears nor sees, because she is dead."}, {"t": "Prescribed Literature", "q": "According to Sir Francis Bacon, bowling is good for ____.", "o": ["lungs", "digestion", "head", "kidneys"], "a": 3, "e": "Bacon writes that bowling is good for 'the stone and reins'. 'Reins' is an old word for the kidneys."}, {"t": "Prescribed Literature", "q": "Who is regarded as the \"Father of English Essay\"?", "o": ["Charles Dickens", "Francis Bacon", "William Shakespeare", "George Orwell"], "a": 1, "e": "Francis Bacon is called the Father of the English Essay. His Essays were first published in 1597."}, {"t": "Prescribed Literature", "q": "According to Sir Francis Bacon, \"Crafty men contemn studies, simple men admire them, and wise men _____ them.\"", "o": ["teach", "apply", "preach", "think"], "a": 1, "e": "Bacon's words are 'wise men use them', meaning wise people apply what they learn."}, {"t": "Prescribed Literature", "q": "According to Rajaji in \"What Makes a Nation\", universities are the hopes of our ____.", "o": ["national leaders", "common people", "scientists", "entrepreneurs"], "a": 0, "e": "As per the answer key, Rajaji says universities are the hopes of our national leaders."}, {"t": "Prescribed Literature", "q": "Who was popularly known as C.R.?", "o": ["Gandhiji", "Rajaji", "Nehruji", "Nanaji"], "a": 1, "e": "C.R. stands for Chakravarti Rajagopalachari, popularly called Rajaji, the last Governor-General of India."}, {"t": "Prescribed Literature", "q": "Rajaji delivered the inspirational speech \"What Makes a Nation\" at", "o": ["Indian Institute of Technology, Guwahati.", "Indian Institute of Management, Ahmedabad.", "National Institute of Technology, Warangal.", "Lakshminarayan Institute of Technology, Nagpur."], "a": 3, "e": "As per the answer key, the speech was delivered at the Lakshminarayan Institute of Technology, Nagpur."}, {"t": "Prescribed Literature", "q": "Where was Old Major's dead body buried? (Animal Farm)", "o": ["at the foot of a mountain", "on the bank of the river", "at the foot of the orchard", "at the corner of Jones's bedroom"], "a": 2, "e": "In George Orwell's Animal Farm, Old Major's body was buried at the foot of the orchard."}, {"t": "Prescribed Literature", "q": "Who is the owner of Manor Farm? (Animal Farm)", "o": ["Old Major", "Snowball", "Mr. Jones", "Mrs. Jones"], "a": 2, "e": "Mr. Jones owns Manor Farm until the animals drive him out and rename it Animal Farm."}, {"t": "Prescribed Literature", "q": "Where were the Seven Commandments written? (Animal Farm)", "o": ["on the five-barred gate", "on a small straw hat", "inside the big barn wall", "on the tarred wall"], "a": 3, "e": "The Seven Commandments were painted on the tarred wall of the big barn."}, {"t": "Prescribed Literature", "q": "Which of the following is NOT included in the Seven Commandments in \"Animal Farm\"?", "o": ["No animal shall drink alcohol", "No animal shall wear clothes", "All animals are not equal", "No animal shall sleep in a bed"], "a": 2, "e": "The original commandment is 'All animals are equal'. 'All animals are not equal' is not one of them."}, {"t": "Prescribed Literature", "q": "Whose favourite maxims are \"I will work harder\" and \"Comrade Napoleon is always right\"? (Animal Farm)", "o": ["Old Major", "Squealer", "Mollie", "Boxer"], "a": 3, "e": "Boxer, the loyal and hard-working cart-horse, lives by these two maxims."}, {"t": "Prescribed Literature", "q": "What is the title of the animals' song in Animal Farm?", "o": ["Beasts of Ireland", "Beasts of England", "Beasts of Scotland", "Beasts of Animal Farm"], "a": 1, "e": "The revolutionary song taught by Old Major is 'Beasts of England'."}]}, {"from": 121, "to": 150, "sub": "To Kill a Mockingbird, Twelfth Night, The Importance of Being Earnest, The Bet, Engine Trouble, and education policies", "q": [{"t": "Prescribed Literature", "q": "What narrative point of view does Harper Lee use to tell 'To Kill a Mockingbird'?", "o": ["Third-person omniscient", "First-person", "Second-person", "Third-person limited"], "a": 1, "e": "The story is told by Scout herself using 'I', so it is first-person narration."}, {"t": "Prescribed Literature", "q": "Who is the narrator of the novel 'To Kill a Mockingbird'?", "o": ["Boo Radley", "Scout Finch", "Atticus Finch", "Jem Finch"], "a": 1, "e": "The narrator is Jean Louise 'Scout' Finch, Atticus's daughter."}, {"t": "Prescribed Literature", "q": "During the main events of 'To Kill a Mockingbird', how does Scout experience the world around her?", "o": ["As a young and growing girl", "As a teacher", "As an adult judge", "As a reporter from another town"], "a": 0, "e": "The events are seen through the eyes of Scout as a young girl growing up, aged about six to nine."}, {"t": "Prescribed Literature", "q": "Who saves Jem and Scout from being attacked on Halloween night? (To Kill a Mockingbird)", "o": ["Atticus Finch", "Boo Radley", "Bob Ewell", "Tom Robinson"], "a": 1, "e": "Boo Radley rescues the children when Bob Ewell attacks them on Halloween night. Bob Ewell is the attacker."}, {"t": "Prescribed Literature", "q": "What is the real name of the reclusive neighbour, Boo Radley?", "o": ["Arthur Radley", "Nathan Radley", "Tom Radley", "James Radley"], "a": 0, "e": "Boo Radley's real name is Arthur Radley. Nathan Radley is his brother."}, {"t": "Prescribed Literature", "q": "What is the profession of Atticus Finch? (To Kill a Mockingbird)", "o": ["Lawyer", "Teacher", "Doctor", "Farmer"], "a": 0, "e": "Atticus Finch is a lawyer who defends Tom Robinson in court."}, {"t": "Prescribed Literature", "q": "Identify the subtitle of the Shakespearean drama 'Twelfth Night'.", "o": ["As you will", "What you desire", "What you wish", "What you will"], "a": 3, "e": "The full title is 'Twelfth Night, or What You Will'."}, {"t": "Prescribed Literature", "q": "Who are the twin characters in the Shakespearean drama 'Twelfth Night'?", "o": ["Orsino and Sebastian", "Olivia and Viola", "Sebastian and Viola", "Fabian and Viola"], "a": 2, "e": "Sebastian and Viola are twin brother and sister, separated in a shipwreck."}, {"t": "Prescribed Literature", "q": "Who was Orsino in the drama 'Twelfth Night'?", "o": ["Duke of Illyria", "Duke of Venice", "Duke of Britain", "Duke of Austria"], "a": 0, "e": "Orsino is the Duke of Illyria, where the play is set."}, {"t": "Prescribed Literature", "q": "In Shakespeare's 'Twelfth Night', Act 1, Scene 1 is set at", "o": ["The sea-coast", "The Duke's palace", "Olivia's house", "A street"], "a": 1, "e": "Act 1, Scene 1 takes place in Duke Orsino's palace. The sea-coast is the setting of Scene 2."}, {"t": "Prescribed Literature", "q": "\"Some are born great, some achieve greatness and some have greatness thrust upon them.\" These famous lines are taken from", "o": ["Hamlet", "The Tempest", "Twelfth Night", "Othello"], "a": 2, "e": "These lines are from the forged letter Malvolio reads in Twelfth Night."}, {"t": "Prescribed Literature", "q": "The opening line of Shakespeare's play 'Twelfth Night' is", "o": ["What country, friends, is this?", "I have sent after him.", "The climate's delicate, the air most sweet.", "If music be the food of love, play on."], "a": 3, "e": "The play opens with Orsino saying 'If music be the food of love, play on'. 'What country, friends, is this?' is Viola's line in Scene 2."}, {"t": "Prescribed Literature", "q": "Who plays a dual role in the play \"The Importance of Being Earnest\"?", "o": ["Algernon", "Fairfax", "Merriman", "Jack"], "a": 3, "e": "Jack Worthing is 'Ernest' in town and 'Jack' in the country, so he leads a double life."}, {"t": "Prescribed Literature", "q": "Who is Merriman in the play \"The Importance of Being Earnest\"?", "o": ["Manservant", "Governess", "Butler", "Housemaid"], "a": 2, "e": "Merriman is the butler at Jack's country house. Lane is Algernon's manservant."}, {"t": "Prescribed Literature", "q": "Who is playing the piano at the beginning of \"The Importance of Being Earnest\"?", "o": ["Algernon", "Lane", "Jack", "Lady Bracknell"], "a": 0, "e": "The play opens with Algernon playing the piano in his flat while Lane arranges tea."}, {"t": "Prescribed Literature", "q": "Where does Algernon Moncrieff live? (The Importance of Being Earnest)", "o": ["In Manor House", "In Half-Moon Street", "In Thames Street", "In Grosvenor Street"], "a": 1, "e": "Algernon lives in a flat in Half-Moon Street, London."}, {"t": "Prescribed Literature", "q": "When Jack is forced to confess that he has no brother, what does he describe as a 'painful position' that he is 'inexperienced' in? (The Importance of Being Earnest)", "o": ["Facing the anger of two young women", "Managing his family estate", "Breaking off an engagement", "Speaking the absolute truth"], "a": 3, "e": "Jack says it is very painful for him to be forced to speak the truth, something he has never done before."}, {"t": "Prescribed Literature", "q": "In \"The Importance of Being Earnest\", what is the only thing that consoles Algernon when he is in trouble?", "o": ["Eating", "Drinking", "Chatting", "Meditating"], "a": 0, "e": "Algernon says that when he is in trouble, eating is the only thing that consoles him, as he keeps eating muffins."}, {"t": "Prescribed Literature", "q": "Where does the banker keep the lawyer imprisoned during the fifteen-year bet? (The Bet)", "o": ["A public state prison downtown", "A small lodge in the banker's garden", "A secret underground dungeon", "A remote cabin"], "a": 1, "e": "In Chekhov's 'The Bet', the lawyer lives in a lodge in the banker's garden for the confinement."}, {"t": "Prescribed Literature", "q": "How much money does the banker bet that the lawyer cannot stay in confinement for the agreed time? (The Bet)", "o": ["Two million rubles", "One hundred thousand rubles", "Ten million rubles", "Five hundred thousand rubles"], "a": 0, "e": "The banker bets two million rubles."}, {"t": "Prescribed Literature", "q": "How many years does the lawyer agree to spend in solitary confinement to win the bet? (The Bet)", "o": ["5 years", "10 years", "15 years", "20 years"], "a": 2, "e": "The lawyer agrees to 15 years of solitary confinement."}, {"t": "Prescribed Literature", "q": "In R.K. Narayan's \"Engine Trouble\", what did the narrator win at the Gaiety Show?", "o": ["A pincushion", "A sewing machine", "A camera", "A road engine"], "a": 3, "e": "The narrator wins a huge road engine in a lottery at the Gaiety Show, which causes all his troubles."}, {"t": "Prescribed Literature", "q": "What is the name of the imaginary town created by R.K. Narayan? (Engine Trouble)", "o": ["Phalgudi", "Thalgudi", "Malgudi", "Kalgudi"], "a": 2, "e": "Malgudi is R.K. Narayan's fictional South Indian town, the setting of most of his stories."}, {"t": "Prescribed Literature", "q": "Who performed the yogic feats in the story \"Engine Trouble\" by R.K. Narayan?", "o": ["Swamiji", "The Narrator", "The Municipal Chairman", "The Showman"], "a": 0, "e": "A Swamiji performed yogic feats and offered to let the road engine run over his chest."}, {"t": "Policies & Commissions", "q": "Which Governor General approved Macaulay's Minute on Education in 1835?", "o": ["William James", "Lord Dalhousie", "William Bentinck", "Lord Mountbatten"], "a": 2, "e": "Lord William Bentinck approved Macaulay's Minute in 1835, making English the medium of higher education."}, {"t": "Policies & Commissions", "q": "A polyglot is a person who is ____", "o": ["able to speak only one language", "able to speak the mother tongue fluently", "able to speak more than two languages", "able to speak English only"], "a": 2, "e": "A polyglot knows and can use many languages."}, {"t": "Policies & Commissions", "q": "Which committee is also known as \"The University Education Commission\"?", "o": ["Kothari Commission", "NPE 1968", "Secondary Education Commission", "Dr. Sarvepalli Radhakrishnan Committee"], "a": 3, "e": "The University Education Commission (1948–49) was chaired by Dr. Sarvepalli Radhakrishnan."}, {"t": "Policies & Commissions", "q": "Which of the following is NOT an objective of teaching English?", "o": ["To make learning an enjoyable activity.", "To help learners read and understand simple words, sentences and passages.", "To familiarize pupils with the spoken and written forms of English.", "To punish the learners for improving fluency."], "a": 3, "e": "Punishing learners is never a teaching objective. The other three are genuine aims of English teaching."}, {"t": "Policies & Commissions", "q": "CCE is a paradigm shift in the teaching-learning process. CCE means…", "o": ["Comprehensive Curriculum Efforts", "Continuous Comprehensive Evaluation", "Collective and Continuous Evaluation", "Competitive Comprehensive Evaluation"], "a": 1, "e": "CCE stands for Continuous and Comprehensive Evaluation, which assesses all aspects of a child's development throughout the year."}, {"t": "Policies & Commissions", "q": "Which statement supports English language fluency enhancement at school level?", "o": ["Writing homework regularly.", "Establishing an English Language Laboratory.", "Using only charts.", "Punishments given for wrong spellings."], "a": 1, "e": "An English language lab gives regular listening and speaking practice, which builds fluency."}]}, {"from": 151, "to": 180, "sub": "Education bodies, methods and approaches, phonetics, teaching aids, lesson planning and evaluation", "q": [{"t": "Policies & Commissions", "q": "The full form of CABE is", "o": ["Common Academic Board of Education", "Central Academic Board of Education", "Central Advisory Board of Education", "Common Advisory Board on Education"], "a": 2, "e": "CABE is the Central Advisory Board of Education, the highest advisory body on education in India."}, {"t": "Policies & Commissions", "q": "The \"Magna Carta of Indian Education\" is", "o": ["Kothari Commission", "Wood's Despatch", "Yashpal Committee", "NEP 2020"], "a": 1, "e": "Wood's Despatch (1854) is called the Magna Carta of English education in India. It proposed a graded school system and universities."}, {"t": "Methods, Approaches & Phonetics", "q": "The English language has _____ distinct sounds or phonemes.", "o": ["26", "44", "24", "48"], "a": 1, "e": "English has 44 phonemes: 20 vowel sounds (12 pure vowels + 8 diphthongs) and 24 consonant sounds. 26 is the number of letters."}, {"t": "Methods, Approaches & Phonetics", "q": "The S-O-S approach means", "o": ["Situational-Objective-Structural approach", "Structural-Oral-Situational approach", "Situational-Oral-Structural approach", "Structural-Objective-Situational approach"], "a": 1, "e": "S-O-S stands for the Structural-Oral-Situational approach: structures are taught orally through real situations."}, {"t": "Methods, Approaches & Phonetics", "q": "Which is NOT a feature of the Audio-Lingual Method?", "o": ["Repetition drill", "Dialogue memorization", "Transformation drill", "Imagination"], "a": 3, "e": "The Audio-Lingual Method relies on drills and memorizing dialogues. Imagination is not one of its features."}, {"t": "Methods, Approaches & Phonetics", "q": "Who proposed the Bilingual Method?", "o": ["Robert Lado", "Stephen Krashen", "Lev Vygotsky", "Dr. C.J. Dodson"], "a": 3, "e": "The Bilingual Method was developed by Dr. C.J. Dodson. It uses the mother tongue to give meaning, then practises in English."}, {"t": "Methods, Approaches & Phonetics", "q": "Which is NOT a feature of child-centred teaching?", "o": ["Focuses on both meaning and form", "Directs learners to solve tasks and understand the language better", "Corporal punishments for wrong answers", "Develops curiosity, creativity and critical thinking"], "a": 2, "e": "Child-centred teaching never uses corporal punishment. It is also banned under the RTE Act."}, {"t": "Methods, Approaches & Phonetics", "q": "The existing knowledge of the learner is called ____", "o": ["information", "ego", "schema", "technology"], "a": 2, "e": "Schema is the learner's prior knowledge, which new learning is connected to."}, {"t": "Methods, Approaches & Phonetics", "q": "Who introduced the \"Input Hypothesis\" theory of second language acquisition?", "o": ["Charles Darwin", "Ivan Pavlov", "Stephen Krashen", "Abraham Maslow"], "a": 2, "e": "Stephen Krashen proposed the Input Hypothesis (i + 1): learners acquire language from input just above their current level."}, {"t": "Methods, Approaches & Phonetics", "q": "A substitution table can be used to teach", "o": ["articles", "structures", "determiners", "sounds"], "a": 1, "e": "A substitution table helps learners form many correct sentences of one pattern, so it is used to teach sentence structures."}, {"t": "Methods, Approaches & Phonetics", "q": "The words which carry the meaning are called ___", "o": ["Content words", "Passive words", "Active voice", "Structural words"], "a": 0, "e": "Content words (nouns, main verbs, adjectives, adverbs) carry meaning. Structural words (articles, prepositions, conjunctions) show grammatical relations."}, {"t": "Methods, Approaches & Phonetics", "q": "A teacher correcting students' errors at a later time without mentioning any names is called", "o": ["Error tolerance", "Error intolerance", "Error finding", "Fault finding"], "a": 0, "e": "Error tolerance means not interrupting learners for every mistake, and correcting common errors later without naming anyone, so their confidence is protected."}, {"t": "Methods, Approaches & Phonetics", "q": "Vowel glides are also known as ____", "o": ["consonants", "punctuation", "monophthongs", "diphthongs"], "a": 3, "e": "A diphthong is a glide from one vowel sound to another, e.g. /aɪ/ in 'my' and /eɪ/ in 'day'. Monophthongs are pure vowels."}, {"t": "Methods, Approaches & Phonetics", "q": "The sounds /p/ and /b/ are ____", "o": ["Plosives", "Nasals", "Affricates", "Laterals"], "a": 0, "e": "/p/ and /b/ are made by closing the lips and releasing air suddenly, so they are plosives (bilabial plosives)."}, {"t": "Methods, Approaches & Phonetics", "q": "Identify the phonetic transcription of the word 'cease'.", "o": ["/ci:s/", "/tsi:s/", "/si:s/", "/ki:s/"], "a": 2, "e": "'Cease' is pronounced /siːs/. The 'c' before 'e' sounds like /s/."}, {"t": "Methods, Approaches & Phonetics", "q": "'Syllabification' means _____", "o": ["join the vowels", "break the word into syllables", "identify the vowels", "counting the syllables"], "a": 1, "e": "Syllabification is dividing a word into its syllables, e.g. en-gi-neer."}, {"t": "Methods, Approaches & Phonetics", "q": "Identify the correct stress in the word 'engineer'.", "o": ["en'gineer", "engine'er", "engi'neer", "'engineer"], "a": 2, "e": "'Engineer' is stressed on the third syllable: en-gi-NEER. Words ending in -eer take stress on that ending."}, {"t": "Methods, Approaches & Phonetics", "q": "We use falling intonation in", "o": ["Requests", "Apologies", "Greetings", "Ordinary statements"], "a": 3, "e": "Falling intonation is used in ordinary statements, Wh-questions and commands. Polite requests usually rise."}, {"t": "TLM, Planning & Evaluation", "q": "The expanded form of OHP is", "o": ["Overhead Pressure", "Overhead Projector", "Overhead Protection", "Overhead Project"], "a": 1, "e": "OHP stands for Overhead Projector, a projected teaching aid."}, {"t": "TLM, Planning & Evaluation", "q": "Choose the authentic material from the following.", "o": ["Textbook", "Supplementary Reader", "Railway ticket", "Workbook"], "a": 2, "e": "Authentic materials are real-life items not made for teaching, such as a railway ticket, menu card or newspaper."}, {"t": "TLM, Planning & Evaluation", "q": "Teaching learning materials are used", "o": ["to make the classroom passive and inactive.", "to increase boredom and fatigue.", "to suppress the innate abilities of the learners.", "to motivate the learners and make them understand the concepts easily."], "a": 3, "e": "TLMs motivate learners and make concepts clear and easy to understand."}, {"t": "TLM, Planning & Evaluation", "q": "Steps involved in planning a poetry lesson:", "o": ["Presentation, Appreciation, Preparation, Interpretation", "Preparation, Presentation, Interpretation, Appreciation", "Appreciation, Presentation, Interpretation, Preparation", "Interpretation, Preparation, Appreciation, Presentation"], "a": 1, "e": "A poetry lesson follows Preparation → Presentation → Interpretation → Appreciation."}, {"t": "TLM, Planning & Evaluation", "q": "In linguistics, the word 'competence' refers to a person's ____", "o": ["knowledge of swimming", "knowledge of playing", "subconscious knowledge of rules governing the formation of speech", "subconscious memory of beliefs and habits"], "a": 2, "e": "According to Chomsky, competence is the speaker's subconscious knowledge of language rules. Performance is the actual use of language."}, {"t": "TLM, Planning & Evaluation", "q": "Lesson planning begins with", "o": ["selection of teaching aids", "strategies for developing skills", "writing objectives of the lesson", "evaluation"], "a": 2, "e": "A lesson plan starts by writing the objectives, because everything else depends on what learners should achieve."}, {"t": "TLM, Planning & Evaluation", "q": "The term 'curriculum' is derived from the Latin word 'currere'. It means ____", "o": ["Designing", "Jumping", "Race course", "Playground"], "a": 2, "e": "'Currere' means to run, so curriculum originally meant a race course: the path a learner runs through."}, {"t": "TLM, Planning & Evaluation", "q": "The RTE Act came into effect on ___", "o": ["1st January 2010", "1st August 2010", "1st April 2010", "1st September 2010"], "a": 2, "e": "The Right of Children to Free and Compulsory Education Act, 2009 came into force on 1 April 2010."}, {"t": "TLM, Planning & Evaluation", "q": "Identify the guiding principle that was NOT in NCF-2005.", "o": ["Child-centred curriculum", "Learning should be interesting and joyful", "Encourage rote learning and by-heart methods", "Learning takes place both within and outside school"], "a": 2, "e": "NCF-2005 asked schools to move away from rote learning, so encouraging it was not one of its principles."}, {"t": "TLM, Planning & Evaluation", "q": "Which is NOT a quality of a good test?", "o": ["Ambiguity", "Validity", "Reliability", "Usability"], "a": 0, "e": "A good test is valid, reliable, usable and objective. Ambiguity (unclear questions) is a defect."}, {"t": "TLM, Planning & Evaluation", "q": "Assessment of learning is", "o": ["Self Assessment", "Formative Assessment", "Peer Assessment", "Summative Assessment"], "a": 3, "e": "Assessment OF learning measures what was learnt at the end of a unit or term, so it is summative. Assessment FOR learning is formative."}, {"t": "TLM, Planning & Evaluation", "q": "Which domain is NOT in Bloom's Taxonomy?", "o": ["Cognitive", "Affective", "Psychomotor", "Physiological"], "a": 3, "e": "Bloom's three domains are Cognitive (knowing), Affective (feeling) and Psychomotor (doing). Physiological is not one of them."}]}];

  document.getElementById("hsub").textContent="180 questions in 6 sets of 30, with answers and explanations";
  let h=`<p class="intro">Choose a set to begin. Each answer shows the correct option and an explanation right away.</p><div class="sets">`;
  SETS.forEach((s,i)=>{
    h+=`<button class="set" id="set${i}" onclick="openSet(${i})"><span class="no">${i+1}</span><span class="info"><span class="rng">Questions ${s.from}–${s.to}</span><div class="tp">${s.sub}</div>${best[i]!==null?`<div class="best">Last score: ${best[i]} / 30</div>`:""}</span><span class="go" aria-hidden="true">›</span></button>`;
  });
  app.innerHTML=h+`</div>`; window.scrollTo({top:0});
}
function openSet(i){
  S=i; Q=SETS[i].q; OFF=SETS[i].from; cur=0; done=false; ans=new Array(Q.length).fill(null);
  document.getElementById("bar").hidden=false;
  document.getElementById("h1").textContent=`Set ${i+1} · Q ${SETS[i].from}–${SETS[i].to}`;
  document.getElementById("hsub").textContent=SETS[i].sub;
  render(); window.scrollTo({top:0});
}
function updateBar(){
  const n=ans.filter(a=>a!==null).length;
  document.getElementById("fill").style.width=(n/Q.length*100)+"%";
  document.getElementById("pos").textContent=done?"Finished":"Q "+(cur+OFF)+" ("+(cur+1)+"/"+Q.length+")";
  document.getElementById("sc").textContent="Score "+score();
}
function render(){
  updateBar();
  if(done) return result();
  const q=Q[cur], a=ans[cur];
  let h=`<div class="backrow"><button class="btn ghost" id="back" onclick="home()">‹ All sets</button></div><section class="card"><div><div class="qno">Question ${cur+OFF}</div><div class="topic">${q.t}</div></div><p class="q">${esc(q.q)}</p><div class="opts">`;
  q.o.forEach((o,i)=>{let c="";if(a!==null){if(i===q.a)c="right";else if(i===a)c="wrong";}
    h+=`<button class="opt ${c}" id="o${i}" ${a!==null?"disabled":""} onclick="pick(${i})"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`;});
  h+=`</div>`;
  if(a!==null){const ok=a===q.a;h+=`<div class="exp"><b class="verdict ${ok?"ok":"no"}">${ok?"Correct!":"Not quite. Correct answer: "+L[q.a]+") "+esc(q.o[q.a])}</b>${esc(q.e)}</div>`;}
  h+=`<div class="nav"><button class="btn ghost" id="prev" onclick="go(-1)" ${cur===0?"disabled":""}>Previous</button>`;
  h+=cur===Q.length-1?`<button class="btn" id="fin" onclick="finish()">See result</button>`:`<button class="btn" id="next" onclick="go(1)">${a===null?"Skip":"Next"}</button>`;
  app.innerHTML=h+`</div></section>`;
}
function pick(i){if(ans[cur]!==null)return;ans[cur]=i;render();}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();window.scrollTo({top:0});}
function finish(){done=true;best[S]=score();render();window.scrollTo({top:0});}
function result(){
  const s=score(),att=ans.filter(a=>a!==null).length,pct=Math.round(s/Q.length*100);
  const msg=pct>=80?"Excellent work!":pct>=60?"Good. Review the ones you missed.":"Keep practising. Read the explanations again.";
  let h=`<section class="card score"><div class="eyebrow">Set ${S+1} result</div><div class="big">${s} / ${Q.length}</div><p class="sub">${pct}% · Attempted ${att} · Wrong ${att-s} · Skipped ${Q.length-att}</p><p>${msg}</p><div class="grid">`;
  Q.forEach((q,i)=>{const c=ans[i]===null?"":ans[i]===q.a?"r":"w";h+=`<button class="dot ${c}" onclick="review(${i})" aria-label="Review question ${i+OFF}">${i+OFF}</button>`;});
  h+=`</div><p class="sub">Tap a number to review that question.</p><div class="nav" style="justify-content:center"><button class="btn ghost" id="again" onclick="openSet(S)">Try again</button>`;
  if(S<SETS.length-1)h+=`<button class="btn" id="nextset" onclick="openSet(${S+1})">Next set ›</button>`;
  h+=`<button class="btn ghost" id="home" onclick="home()">All sets</button></div></section>`;
  app.innerHTML=h;
}
function review(i){done=false;cur=i;render();}
home();
</script>
</body>
</html>
